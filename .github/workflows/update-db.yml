name: Aktualizacja bazy WZDB

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Wymuś przebudowę mimo braku zmian źródła i generatora
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-wzdb-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zainstaluj zależności
        run: python -m pip install --requirement requirements.txt

      - name: Pobierz źródłowy XLSM
        id: source
        env:
          SOURCE_URL: "https://drive.google.com/uc?id=15p7L2RPKcSMIVzoZXkGDkZZqR5xlBA9K&export=download"
          FALLBACK_URL: "https://drive.usercontent.google.com/download?id=15p7L2RPKcSMIVzoZXkGDkZZqR5xlBA9K&export=download&confirm=t"
          XLSM_PATH: ${{ runner.temp }}/PL2.xlsm
          HEADERS_PATH: ${{ runner.temp }}/drive-headers.txt
          REQUEST_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! curl --fail --location --retry 3 --retry-all-errors \
            --header "Cache-Control: no-cache" --header "Pragma: no-cache" \
            --dump-header "$HEADERS_PATH" \
            "$FALLBACK_URL&cachebust=$REQUEST_NONCE" --output "$XLSM_PATH"; then
            gdown --fuzzy "$SOURCE_URL&cachebust=$REQUEST_NONCE" --output "$XLSM_PATH"
          fi
          python - "$XLSM_PATH" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if path.stat().st_size < 1_000_000 or path.read_bytes()[:2] != b"PK":
              raise SystemExit("Pobrany plik nie jest prawidłowym skoroszytem XLSM")
          PY
          source_modified="$(python - "$HEADERS_PATH" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if path.exists():
              for line in reversed(path.read_text(encoding="utf-8", errors="replace").splitlines()):
                  if line.lower().startswith("last-modified:"):
                      print(line.split(":", 1)[1].strip())
                      break
          PY
          )"
          echo "modified=$source_modified" >> "$GITHUB_OUTPUT"
          echo "Google Drive Last-Modified: ${source_modified:-brak w odpowiedzi}"

      - name: Sprawdź, czy źródło lub generator się zmieniły
        id: rebuild
        env:
          XLSM_PATH: ${{ runner.temp }}/PL2.xlsm
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          source_sha256="$(sha256sum "$XLSM_PATH" | cut -d ' ' -f 1)"
          generator_sha256="$(python - <<'PY'
          from pathlib import Path

          from scripts.build_wzdb import generation_input_sha256

          print(generation_input_sha256([
              Path("scripts/build_wzdb.py"),
              Path("scripts/event_dates.py"),
              Path("scripts/match_event_dates.py"),
          ]))
          PY
          )"
          echo "Google Drive source SHA-256: $source_sha256"
          readarray -t current_hashes < <(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("db/version.json")
          if path.exists():
              version = json.loads(path.read_text(encoding="utf-8"))
              print(version.get("source_sha256", ""))
              print(version.get("generator_sha256", ""))
          else:
              print()
              print()
          PY
          )
          echo "sha256=$source_sha256" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_REBUILD" = "true" ] || \
             [ "$source_sha256" != "${current_hashes[0]}" ] || \
             [ "$generator_sha256" != "${current_hashes[1]}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Źródło i generator nie zmieniły się; kończę bez przebudowy i commita."
          fi

      - name: Zbuduj WZDB v4
        if: steps.rebuild.outputs.changed == 'true'
        env:
          XLSM_PATH: ${{ runner.temp }}/PL2.xlsm
          SOURCE_MODIFIED: ${{ steps.source.outputs.modified }}
        run: |
          python scripts/build_wzdb.py "$XLSM_PATH" \
            --output db/latest.wzdb \
            --version-file db/version.json \
            --source-modified "$SOURCE_MODIFIED" \
            --require-complete-event-dates \
            --expect-date-conflicts 0

      - name: Commit i push do main
        if: steps.rebuild.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- db/latest.wzdb db/version.json
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "chore(db): update speedway results database"
          git push origin HEAD:main
